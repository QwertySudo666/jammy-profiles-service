name: jammy-profiles-service pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # STEP 1: LINT & STATIC ANALYSIS
      - name: Code Quality (Spotless)
        run: ./mvnw spotless:check

      # STEP 2: UNIT TESTS
      - name: Run Unit Tests
        run: ./mvnw test

      # STEP 3: INTEGRATION TESTS (The Postgres stuff)
      - name: Run Integration Tests
        run: ./mvnw verify -DskipUnitTests -Dquarkus.hibernate-orm.database.generation=none

#      # STEP 4: PACKAGE (Store the result)
#      - name: Package Application
#        run: ./mvnw package -DskipTests

      # STEP 4: ARTIFACT UPLOAD (Зберігаємо результат збирання)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-app
          path: target/quarkus-app/

  build-and-push-to-ghcr:
    needs: test-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true