# configure your datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=password
#datasource should be disabled to run ./mvnw verify or enabled but with running docker
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jammy-profile-db

# Liquibase minimal config properties
quarkus.liquibase.migrate-at-start=true

# Liquibase optional config properties
%dev.quarkus.liquibase.contexts=dev
%test.quarkus.liquibase.contexts=!dev
# quarkus.liquibase.change-log=db/changeLog.xml
